[package]
name = "klimapy_native"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
faer = { version = "=0.24.4", default-features = false, features = ["std", "linalg"] }

shapefile = "=0.9.0"
geo = { version = "=0.33.1", default-features = false }
serde_json = "1"
libm = "=0.2.16"

[profile.release]
codegen-units = 1
lto = true
