name: Check and publish Python package
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  python-check:
    uses: ./.github/workflows/python-check.yml
  rust-check:
    uses: ./.github/workflows/rust-check.yml
  build:
    needs: [rust-check]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: manylinux-wheel
          path: dist/
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: native-wheel-windows-latest
          path: dist/
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: native-wheel-macos-latest
          path: dist/
      - name: Build and check distributions
        run: |
          python -m pip install build twine
          python -m build --sdist
          python -m twine check dist/*
      - uses: conda-incubator/setup-miniconda@04b72d7799e2bae3771b041de9b46c710d29caab # v4
        with:
          miniforge-version: latest
          activate-environment: Test
          environment-file: environment.yml
          python-version: '3.12'
      - name: Check version and installed wheel
        run: |
          sudo apt-get update
          sudo apt-get install -y libnetcdf-dev
          conda run -n Test python -m pip install --no-deps dist/*manylinux*.whl
          conda run --no-capture-output -n Test python -c "import os; from importlib.metadata import version; from klimapy import backend_info; ref=os.environ['GITHUB_REF']; v=version('klimapy'); assert not ref.startswith('refs/tags/') or ref == 'refs/tags/v'+v; assert backend_info()['rust_available']"
          conda run -n Test python tools/manage.py test --installed --require-rust
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: python-distributions
          path: dist/
          if-no-files-found: error
  publish:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [build, python-check, rust-check]
    runs-on: ubuntu-24.04
    environment:
      name: pypi
      url: https://pypi.org/p/klimapy
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: python-distributions
          path: dist/
      - name: Publish to PyPI with Trusted Publishing
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
