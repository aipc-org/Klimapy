name: Check and publish Python package
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  python-check:
    uses: ./.github/workflows/python-check.yml
  rust-check:
    uses: ./.github/workflows/rust-check.yml
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: Build and check distributions
        run: |
          python -m pip install build twine
          python tools/manage.py build --rust off
          python -m twine check dist/*
      - name: Check version and installed wheel
        run: |
          python -m venv /tmp/klimapy-wheel-check
          /tmp/klimapy-wheel-check/bin/python -m pip install dist/*.whl
          /tmp/klimapy-wheel-check/bin/python - <<'PY'
          import os
          from importlib.metadata import version
          import klimapy
          installed = version('klimapy')
          ref = os.environ['GITHUB_REF']
          if ref.startswith('refs/tags/') and ref != 'refs/tags/v' + installed:
              raise SystemExit(f'Tag {ref} does not match package version {installed}')
          assert hasattr(klimapy, 'BCSD') and hasattr(klimapy, 'ETCCDI')
          print(f'Installed klimapy {installed}: import checks passed')
          PY
          /tmp/klimapy-wheel-check/bin/python tools/manage.py test --installed
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: python-distributions
          path: dist/
          if-no-files-found: error
  publish:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [build, python-check, rust-check]
    runs-on: ubuntu-24.04
    environment:
      name: pypi
      url: https://pypi.org/p/klimapy
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: python-distributions
          path: dist/
      - name: Publish to PyPI with Trusted Publishing
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
