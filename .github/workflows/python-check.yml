name: Check clean Test environment
on:
  workflow_call:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-python:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        python: ['3.8', '3.10', '3.12', '3.13']
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: conda-incubator/setup-miniconda@04b72d7799e2bae3771b041de9b46c710d29caab # v4
        with:
          miniforge-version: latest
          activate-environment: Test
          environment-file: environment.yml
          python-version: ${{ matrix.python }}
      - name: Prepare native runtime and Rust
        run: |
          sudo apt-get update
          sudo apt-get install -y libnetcdf-dev
          rustup toolchain install stable --profile minimal
          rustup default stable
      - name: Install only Klimapy core
        run: python -m pip install --no-deps --no-build-isolation .
      - name: Verify native package inside Test
        run: python tools/manage.py test --installed --require-rust
