name: Check Python compatibility and core-only install
on:
  workflow_call:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  core-python:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - python: '3.8'
            dependencies: lowest
          - python: '3.10'
            dependencies: latest
          - python: '3.12'
            dependencies: latest
          - python: '3.13'
            dependencies: latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install lowest supported dependencies
        if: matrix.dependencies == 'lowest'
        run: python -m pip install numpy==1.23.0 pandas==1.5.0 xarray==2023.1.0 scipy==1.9.0 cftime==1.6.0 tqdm==4.60.0
      - name: Install pure Python package without GIS
        env:
          KLIMAPY_BUILD_RUST: '0'
        run: |
          python -m pip install .
          python -c "import klimapy, sys; assert 'geopandas' not in sys.modules; assert 'rioxarray' not in sys.modules"
      - name: Verify calculations, fallbacks and documentation links
        run: python tools/manage.py test --installed
