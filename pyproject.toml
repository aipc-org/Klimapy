[build-system]
requires = ["setuptools>=65.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "klimapy"
version = "1.1.0"
authors = [
    {name = "YuHaoRan", email = "yuhaoran251@mails.ucas.ac.cn"}
]
description = "Klimapy 为气候分析提供统一入口，用 Python 表达研究流程，让 Rust 执行底层计算，把精力留给问题本身。"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
dependencies = ["numpy>=1.23.0"]

[project.optional-dependencies]
dev = ["build", "twine", "ruff"]

[project.urls]
"Homepage" = "https://michalrees.bid/klimapy/"
"Documentation" = "https://michalrees.bid/klimapy/docs/"
"Bug Tracker" = "https://github.com/michalrees/klimapy/issues"
"Source Code" = "https://github.com/michalrees/klimapy"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
klimapy = ["_licenses/*"]
