[build-system]
requires = ["setuptools>=65.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "klimapy"
version = "1.0.0"
authors = [
    {name = "YuHaoRan", email = "yuhaoran251@mails.ucas.ac.cn"}
]
description = "Python tools for climate data analysis including ETCCDI,BCSD modules"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
dependencies = [
    "numpy>=1.23.0",
    "pandas>=1.5.0",
    "xarray>=2023.1.0",
    "tqdm>=4.60.0",
    "cftime>=1.6.0",
    "scipy>=1.9.0"
]

[project.optional-dependencies]
gis = ["rioxarray>=0.13", "geopandas>=0.12", "shapely>=1.8"]
io = ["netCDF4>=1.6"]
parallel = ["dask[array]>=2023.1"]
dev = ["build", "twine", "ruff"]

[project.urls]
"Bug Tracker" = "https://github.com/michalrees/klimapy/issues"
"Source Code" = "https://github.com/michalrees/klimapy"

[tool.setuptools.packages.find]
where = ["src"]